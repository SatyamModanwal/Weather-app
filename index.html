```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="back">
        <div class="card">

            <!-- Search Box -->
            <div class="search">
                <input type="text" placeholder="Search for a city">
                <button id="btn">
                    <img src="search.svg" alt="Search">
                </button>
            </div>

            <!-- Weather Information -->
            <div class="weatherStatus">
                <img src="day.svg" alt="Clear weather" class="weather-icon">

                <h1 id="temp">27°C</h1>
                <h1 id="city">Delhi</h1>
            </div>

            <!-- Humidity and Wind -->
            <div class="w2">

                <!-- Humidity -->
                <div class="humidity">
                    <img
                        src="humidity.svg"
                        alt="Humidity"
                        class="info-icon"
                    >

                    <h2 id="dh">20%</h2>
                    <h2 id="th">Humidity</h2>
                </div>

                <!-- Wind -->
                <div class="wind">
                    <img
                        src="wind.png"
                        alt="Wind"
                        class="info-icon"
                    >

                    <h2 id="dw">20 km/h</h2>
                    <h2 id="tw">Wind</h2>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
```
